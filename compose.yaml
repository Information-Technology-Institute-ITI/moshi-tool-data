name: moshi-whisperx

services:
  whisperx:
    build:
      context: ./processing_service
    restart: unless-stopped
    network_mode: host
    environment:
      MOSHI_DISPATCH_TOKEN: ${MOSHI_DISPATCH_TOKEN:?set MOSHI_DISPATCH_TOKEN}
      MOSHI_WORKER_TOKEN: ${MOSHI_WORKER_TOKEN:?set MOSHI_WORKER_TOKEN}
      MOSHI_BUILD_ID: ${MOSHI_BUILD_ID:?set MOSHI_BUILD_ID}
      MOSHI_WEB_INTERNAL_URL: ${MOSHI_WEB_INTERNAL_URL:?set MOSHI_WEB_INTERNAL_URL}
      MOSHI_GPU_INTAKE_HOST: 0.0.0.0
      MOSHI_GPU_INTAKE_PORT: ${MOSHI_GPU_INTAKE_PORT:-8766}
      MOSHI_GPU_CACHE: /cache
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /cache/huggingface
    volumes:
      - ./local_data/gpu_cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen(f"http://127.0.0.1:{os.environ.get('MOSHI_GPU_INTAKE_PORT', '8766')}/health/live", timeout=4)
      interval: 10s
      timeout: 5s
      retries: 6
