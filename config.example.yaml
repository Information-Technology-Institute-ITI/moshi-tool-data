audio:
  sample_rate: 24000
  sample_width: 16
  fade_ms: 10
  preserve_source_channels: true

channel_routing:
  # Review suggests independent routing; mono disables channel-first suggestions.
  mode: review
  analysis_seconds: 300
  activity_threshold_db: -48
  dominance_db: 9
  minimum_dominant_fraction: 0.05
  maximum_absolute_correlation: 0.80
  mapping_minimum_margin_db: 6

transcription:
  quality_profile: balanced
  model: large-v3
  # Null derives Systran/faster-whisper-<model>. Loads resolve to a commit SHA.
  model_repository: null
  model_revision: edaa852ec7e145841d8ffdb056a99866b5f0a478
  # Set this to a different locally cached Whisper model for independent review.
  # When null, flagged segments use the main model with a stricter decode.
  review_model: null
  review_model_repository: null
  review_model_revision: null
  language: ar
  device: auto
  compute_type: float16
  batch_size: 1
  chunk_size: 20
  retry_chunk_size: 10
  beam_size: 5
  review_beam_size: 8
  repetition_penalty: 1.1
  no_repeat_ngram_size: 3
  hallucination_silence_threshold: 1.0
  suspect_avg_logprob: -0.50
  min_words_per_second: 0.35
  max_words_per_second: 6.0
  max_repeated_ngram_occurrences: 3
  decode_disagreement_ratio: 0.25

alignment:
  backend: whisperx
  model: jonatasgrosman/wav2vec2-large-xlsr-53-arabic
  model_revision: af46c2d8531b8dcbb5e23b952f739b372c2e5d2d
  low_confidence_score: 0.40

diarization:
  model: pyannote/speaker-diarization-community-1
  model_revision: 3533c8cf8e369892e6b79ff1bf80f7b0286a54ee
  min_speakers: 2
  max_speakers: 2
  min_assignment_overlap: 0.35
  short_turn_seconds: 0.35
  # Bridge only same-speaker gaps containing an aligned word; overlap and exclusions block it.
  activity_merge_gap_seconds: 0.50

separation:
  enabled: false
  backend: speechbrain
  model: speechbrain/sepformer-whamr16k
  model_revision: 21a5b500c6f52fddc387c5d9e5fb13ffd6f039c5
  embedding_model: speechbrain/spkrec-ecapa-voxceleb
  embedding_model_revision: 0f99f2d0ebe89ac095bcc5903c4dd8f72b367286
  sample_rate: 16000
  context_seconds: 1.0
  max_window_seconds: 12.0
  chunk_crossfade_seconds: 0.20
  recovery_seam_ms: 20.0
  minimum_gain: 0.25
  maximum_gain: 4.0
  mixture_consistency: true
  enrollment_seconds: 30.0
  minimum_enrollment_turn: 1.5
  minimum_identity_similarity: 0.65
  minimum_identity_margin: 0.10

segmentation:
  min_duration: 20
  target_duration: 40
  max_duration: 50
  max_overlap_ratio: 0.20
  overlap_warning_ratio: 0.05
  max_silence_ratio: 0.80
  min_speaker_duration: 1.0
  min_speaker_share: 0.02
  context_before: 0.25
  context_after: 0.25

normalization:
  remove_diacritics: true
  normalize_alef: true
  normalize_alef_maqsura: false
  keep_punctuation: true

qc:
  silence_threshold_db: -50.0
  max_channel_silence_ratio: 0.995
  clipping_review_ratio: 0.001
  clipping_reject_ratio: 0.01
  leakage_review_ratio: 0.25
  reconstruction_review_error_db: -15.0
  reconstruction_reject_error_db: -5.0
  low_confidence_review_ratio: 0.10
  low_confidence_reject_ratio: 0.35
  uncertain_assignment_review_ratio: 0.05
  uncertain_assignment_reject_ratio: 0.15

review:
  host: 127.0.0.1
  port: 8765
  require_overlap_review: true
