# Linux Nginx example for the agreed initial private callback/public HTTP map.
# This is intentionally plaintext on port 80. It protects routing and identity,
# but it does not provide confidentiality; move the site and callbacks to TLS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=moshi_callback_rate:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=moshi_callback_connections:10m;

server {
    listen 80 default_server;
    server_name _;

    auth_basic "Moshi Dataset Studio";
    auth_basic_user_file /etc/nginx/moshi.htpasswd;
    client_max_body_size 20g;
    client_body_timeout 60s;

    # Only the fixed GPU source may reach the push-worker callback surface.
    # Bearer authentication and X-Lease-Token fencing are still enforced by FastAPI.
    location = /internal/v1/workers/heartbeat {
        auth_basic off;
        allow 172.31.26.80;
        deny all;
        limit_except POST { deny all; }
        limit_req zone=moshi_callback_rate burst=120 nodelay;
        limit_conn moshi_callback_connections 8;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Moshi-Authenticated-User "";
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/internal/v1/jobs/[A-Za-z0-9_.:-]+/(heartbeat|uploads|complete|fail)$ {
        auth_basic off;
        allow 172.31.26.80;
        deny all;
        limit_except POST { deny all; }
        limit_req zone=moshi_callback_rate burst=120 nodelay;
        limit_conn moshi_callback_connections 8;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Moshi-Authenticated-User "";
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/internal/v1/uploads/[A-Za-z0-9_.:-]+$ {
        auth_basic off;
        allow 172.31.26.80;
        deny all;
        limit_except HEAD PUT { deny all; }
        limit_req zone=moshi_callback_rate burst=120 nodelay;
        limit_conn moshi_callback_connections 8;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Moshi-Authenticated-User "";
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # The legacy pull claim and artifact-download routes are not exposed in push mode.
    location ^~ /internal/ {
        return 404;
    }

    location /api/jobs/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Overwrite, rather than forward, any browser-supplied identity header.
        proxy_set_header X-Moshi-Authenticated-User $remote_user;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Moshi-Authenticated-User $remote_user;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }
}
