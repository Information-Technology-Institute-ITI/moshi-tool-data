[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moshi-web-service"
version = "0.4.0"
description = "Always-on Moshi Dataset Studio web and worker-control service"
requires-python = ">=3.10,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi==0.140.13",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "rich==15.0.0",
  "typer==0.27.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
include = ["moshi_data_pipeline*"]

[tool.setuptools.package-data]
moshi_data_pipeline = [
  "schemas/*.json",
  "review/static/*",
  "studio/static/*",
  "studio/static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]
