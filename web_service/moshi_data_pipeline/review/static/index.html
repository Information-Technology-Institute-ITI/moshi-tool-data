<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moshi Dataset Review</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#141b30;--line:#263150;--ink:#edf3ff;--muted:#9baccc;--cyan:#55d6be;--amber:#ffca66;--red:#ff758f}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#172442 0,var(--bg) 45%);color:var(--ink);font:15px/1.45 Inter,Segoe UI,sans-serif}
    button,select,textarea{font:inherit}.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.rail{padding:24px;border-right:1px solid var(--line);background:#0c1326e8}
    h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}.queue{display:grid;gap:8px}.item{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);color:var(--ink);cursor:pointer}
    .item:hover,.item.active{border-color:var(--cyan)}.badge{font-size:11px;color:var(--amber);float:right}.workspace{padding:28px;max-width:1200px}.empty{color:var(--muted);margin-top:20vh;text-align:center}
    .header{display:flex;align-items:start;justify-content:space-between;gap:16px}.header h2{margin:0}.reasons{color:var(--amber);font-size:13px}.card{background:#111a30dd;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
    audio{width:100%}canvas{width:100%;height:128px;background:#080d1b;border-radius:10px;margin-top:12px}.controls,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    button{border:1px solid var(--line);background:#1a2744;color:var(--ink);border-radius:9px;padding:9px 13px;cursor:pointer}button:hover{border-color:var(--cyan)}button.primary{background:var(--cyan);color:#07120f;font-weight:700}
    button.danger{border-color:#7d2f46;color:#ffafbd}.segment{display:grid;grid-template-columns:110px 130px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
    .time{color:var(--muted);font-variant-numeric:tabular-nums}.segment textarea{min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:#0b1223;color:var(--ink);padding:9px;direction:rtl;text-align:right}
    select{background:#0b1223;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}.flag{color:var(--red);font-size:12px}.status{margin-top:10px;color:var(--muted)}
    @media(max-width:800px){.shell{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line)}.workspace{padding:18px}.segment{grid-template-columns:1fr}.queue{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}}
  </style>
</head>
<body>
<main class="shell">
  <aside class="rail"><h1>Moshi Review</h1><div class="sub">Mixed-podcast quality queue</div><div id="queue" class="queue"></div></aside>
  <section class="workspace"><div id="empty" class="empty">Select a clip to inspect its channels, timeline, and transcript.</div><div id="detail" hidden></div></section>
</main>
<script>
const queue=document.querySelector('#queue'),detail=document.querySelector('#detail'),empty=document.querySelector('#empty');let current=null,audioGraph=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url,options){const response=await fetch(url,options);const body=await response.json();if(!response.ok)throw Error(body.detail||response.statusText);return body}
async function loadQueue(){const data=await json('/api/items');queue.innerHTML=data.items.map(i=>`<button class="item" data-id="${esc(i.clip_id)}">${esc(i.clip_id)}<span class="badge">${esc(i.status)}</span><br><small>${esc((i.reasons||[]).join(', '))}</small></button>`).join('');queue.querySelectorAll('button').forEach(b=>b.onclick=()=>loadItem(b.dataset.id))}
function setupAudio(){const audio=document.querySelector('#player');if(audioGraph)return;const ctx=new AudioContext(),source=ctx.createMediaElementSource(audio),split=ctx.createChannelSplitter(2),left=ctx.createGain(),right=ctx.createGain(),merge=ctx.createChannelMerger(2);source.connect(split);split.connect(left,0);split.connect(right,1);left.connect(merge,0,0);right.connect(merge,0,1);merge.connect(ctx.destination);audioGraph={ctx,left,right};document.querySelector('#left').onclick=()=>{left.gain.value=left.gain.value?0:1};document.querySelector('#right').onclick=()=>{right.gain.value=right.gain.value?0:1}}
function drawTimeline(item){const canvas=document.querySelector('#timeline'),ctx=canvas.getContext('2d');canvas.width=1000;canvas.height=128;ctx.fillStyle='#080d1b';ctx.fillRect(0,0,1000,128);const origin=item.clip_start,duration=Math.max(item.clip_end-origin,1),colors=['#55d6be','#758dff'];item.timeline.forEach(s=>{const x=(Math.max(s.start,origin)-origin)/duration*1000,w=Math.max(1,(Math.min(s.end,item.clip_end)-Math.max(s.start,origin))/duration*1000),index=item.speakers.indexOf(s.speaker);ctx.fillStyle=colors[index%2];ctx.fillRect(x,index?68:22,w,28)});(item.overlap_intervals||[]).forEach(s=>{ctx.fillStyle='#ff758f99';ctx.fillRect((Math.max(s.start,origin)-origin)/duration*1000,54,(Math.min(s.end,item.clip_end)-Math.max(s.start,origin))/duration*1000,18)})}
async function loadItem(id){current=await json('/api/items/'+id);empty.hidden=true;detail.hidden=false;audioGraph=null;detail.innerHTML=`<div class="header"><div><h2>${esc(current.clip_id)} · ${esc(current.status)}</h2><div class="reasons">${esc(current.reasons.join(' · '))}</div></div><strong>${esc(current.assistant_speaker)} = assistant</strong></div><div class="card"><audio id="player" controls src="${current.audio_url}"></audio><canvas id="timeline"></canvas><div class="controls"><button id="left">Mute assistant (left)</button><button id="right">Mute user (right)</button></div></div><div class="card"><h3>Transcript and speaker labels</h3><div id="segments">${current.segments.map((s,i)=>`<div class="segment" data-start="${s.start}" data-end="${s.end}" data-speaker="${esc(s.speaker)}"><div class="time">${s.start.toFixed(2)}–${s.end.toFixed(2)}s${s.quality_flags.length?`<div class="flag">${esc(s.quality_flags.join(', '))}</div>`:''}</div><select>${current.speakers.map(p=>`<option ${p===s.speaker?'selected':''}>${esc(p)}</option>`).join('')}</select><textarea aria-label="Transcript segment ${i+1}">${esc(s.text)}</textarea></div>`).join('')}</div></div><div class="card"><label><input id="auditioned" type="checkbox"> I listened to this clip</label><div class="actions"><button class="primary" onclick="save('approve')">Approve</button><button onclick="save('needs_work')">Save corrections</button><button class="danger" onclick="save('reject')">Reject</button><button onclick="applyChanges()">Apply and rebuild</button></div><div id="status" class="status"></div></div>`;setupAudio();drawTimeline(current);document.querySelectorAll('.item').forEach(b=>b.classList.toggle('active',b.dataset.id===id))}
async function save(decision){const rows=[...document.querySelectorAll('.segment')],segments=rows.map(r=>({start:+r.dataset.start,end:+r.dataset.end,text:r.querySelector('textarea').value})),speaker_overrides=rows.filter(r=>r.querySelector('select').value!==r.dataset.speaker).map(r=>({start:+r.dataset.start,end:+r.dataset.end,speaker:r.querySelector('select').value}));try{const result=await json(`/api/items/${current.clip_id}/decision`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision,auditioned:document.querySelector('#auditioned').checked,segments,speaker_overrides})});document.querySelector('#status').textContent=`Saved. Manifest contains ${result.manifest_records} records.`;await loadQueue()}catch(error){document.querySelector('#status').textContent=error.message}}
async function applyChanges(){const status=document.querySelector('#status');try{const job=await json(`/api/sources/${current.source_key}/apply`,{method:'POST'});status.textContent='Rebuilding downstream stages…';const timer=setInterval(async()=>{const value=await json(`/api/jobs/${job.job_id}`);if(value.status!=='running'){clearInterval(timer);status.textContent=value.status==='complete'?'Rebuild complete. Reloading…':`Rebuild failed: ${value.error}`;if(value.status==='complete'){await loadQueue();await loadItem(current.clip_id)}}},1500)}catch(error){status.textContent=error.message}}
loadQueue();
</script>
</body>
</html>
